// ------------------------------------------------------------ easing and helpers
const E = u => (u <= 0 ? 0 : u >= 1 ? 1 : -(Math.cos(Math.PI * u) - 1) / 2);

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);

function hash2(ix, iy, seed) {

const INSET = { x: 1536, y: 806, w: 322, h: 218 };
const LAKE = (() => {

function inset(g) {
  const b = INSET; dbl(g, b.x, b.y, b.w, b.h);
  g.save(); g.beginPath(); g.rect(b.x + 6, b.y + 6, b.w - 12, b.h - 12); g.clip();

  const pt = new Path2D(); pt.moveTo(1672, 852); pt.bezierCurveTo(1680, 880, 1690, 912, 1704, 924); pt.bezierCurveTo(1720, 922, 1730, 890, 1732, 852); pt.closePath();

// ------------------------------------------------------------ start
function init() {
  sizeAll();
  buildRoute();
  LAUNCH_CUM = [0]; for (let i = 1; i < LAUNCH.length; i++) LAUNCH_CUM.push(LAUNCH_CUM[i - 1] + Math.hypot(LAUNCH[i][0] - LAUNCH[i - 1][0], LAUNCH[i][1] - LAUNCH[i - 1][1]));
  LAUNCH_LEN = LAUNCH_CUM[LAUNCH_CUM.length - 1];
  WRECK = [TIP[0] + 22, TIP[1] + 22];
  STELE = [730, 306];
  { let bi = 0, bd = Infinity; for (let i = 0; i < TRAIL.length; i++) { const d = Math.hypot(TRAIL[i][0] - NOTCH[0], TRAIL[i][1] - NOTCH[1]); if (d < bd) { bd = d; bi = i; } } CREST_S = TRAIL_CUM[bi]; }
  buildLabels();
  layoutCartouche();
  window.seek = seek;
  window.__dbg = { terrain, LABELS, TRAIL, TIP, END, TICKS, COASTLN: () => COASTLN, labelBoxes, CART: () => CART, INSET, NA, camera, fogAt };
  window.__ready = true;
}
function labelBoxes(t) {

    const st = labelState(L, t); if (st.a <= 0) continue;

}

let t0 = null;
function loop(now) {

  requestAnimationFrame(loop);
}
const fontsReady = Promise.all([
  document.fonts.load('400 20px EBG'), document.fonts.load('italic 400 20px EBG'), document.fonts.load('600 20px EBG'), document.fonts.load('600 20px EBGSC')

window.ready = fontsReady.then(() => { init(); if (!RENDER) { seek(0); requestAnimationFrame(loop); } });
addEventListener('resize', () => { if (window.__ready) { sizeAll(); if (RENDER) seek(0); } });
cv.addEventListener('click', () => { t0 = null; });
})();
